---
# 全ノードの準備 → CP の初期化 → ワーカーの join → アドオン の順。
- name: ノードの準備
  hosts: k8s
  roles: [common, containerd]

- name: NAS のディスク（ongeki）
  hosts: nas
  roles: [nas]

- name: NFS サーバ（becky）
  hosts: control_plane
  roles:
    - role: nfs
      when: nfs_enabled

- name: コントロールプレーンの初期化
  hosts: control_plane
  roles: [kubeadm]

- name: ワーカーの参加
  hosts: workers
  roles: [kubeadm]

- name: vxlan-cni（プラグインと DHCP デーモン）
  hosts: k8s
  roles:
    - role: vxlan_cni
      when: vxlan_cni_enabled

- name: アドオンの導入
  hosts: control_plane
  roles: [addons]

- name: DNS (ExternalDNS と FortiGate の webhook) の導入
  hosts: control_plane
  tasks:
    - name: DNS
      ansible.builtin.include_role:
        name: addons
        tasks_from: dns
      when: dns_enabled

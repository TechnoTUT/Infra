---
# ===== バージョン（導入時の最新安定版で固定。更新時はここだけ変える）=====
k8s_minor: "1.37"            # pkgs.k8s.io のリポジトリ系列
cilium_version: "1.20.4"
helm_version: "v4.3.1"
multus_version: "v4.3.1"
kubevirt_version: "v1.9.1"
cdi_version: "v1.66.1"
argocd_chart_version: "10.12.1"
arc_version: "0.15.1"                 # actions-runner-controller (gha-runner-scale-set)
nfs_provisioner_chart_version: "4.0.18"
# containerd.io は Docker の apt リポジトリから入れ、apt-mark hold する（更新は手動）。

# ===== ネットワーク =====
api_endpoint: "192.168.99.200"   # becky
api_port: 6443
pod_cidr: "10.11.0.0/16"
service_cidr: "10.96.0.0/12"   # ClusterIP の範囲（kubeadm の既定値。LB の IP とは別）

# ===== ストレージ（NFS サーバは becky を兼用）=====
nfs_server: "192.168.99.200"
nfs_path: "/nfs"
nfs_export_network: "192.168.99.128/25"

# ===== ネットワーク（VLAN とブリッジのみ。管理用 VLAN は手動）=====
network_manage_vlans: true
network_interfaces_file: /etc/network/interfaces
network_mgmt_vlan: 100
network_vlans:                       # Multus の NetworkAttachmentDefinition が使うブリッジ
  - { id: 10, bridge: br10 }
  - { id: 20, bridge: br20 }

# イメージの取得が遅いネットワークなので、待ち時間を長めにする。
addons_helm_timeout: 30m

# ===== 作業用ディレクトリ（control_plane のホーム）=====
addons_dir: "{{ ansible_facts.env.HOME }}/.k8s-addons"

# ===== ノードの DNS（TUT の DNS サーバ。https://imc.tut.ac.jp/hosting/faq-dns-server.html）=====
node_dns_servers: ["133.15.64.100", "133.15.64.102"]
node_dns_search: srv.utone.technotut.net

# ===== ノードのパッケージ（全ノードで同じ構成にする。余計なものは入れない）=====
common_packages_keep: [openssh-server, openssh-sftp-server, sudo, python3, ifupdown, curl, ca-certificates, openssl]
common_packages_absent:
  - docker-ce            # クラスタは containerd.io を直接使う
  - docker-ce-cli
  - docker-ce-rootless-extras
  - docker-buildx-plugin
  - docker-compose-plugin
  - bind9                # ホストの bind9 は未使用（DNS はクラスタ内の bind9）
  - bind9-utils
  - golang
  - golang-go
  - fastfetch
  - task-japanese
  - task-ssh-server
  - firmware-amd-graphics

# ===== オプション =====
kubevirt_enabled: true       # BLT を VM で動かす間は有効にする（コンテナ化したら false にできる）
multus_enabled: true         # PRO DJ LINK / Ableton Link 用の L2 接続
# NetworkAttachmentDefinition（現行クラスタと同じ。ブリッジは各ノードの /etc/network/interfaces で作る）
multus_nads:
  - { name: vlan10-bridge, namespace: kube-public, network: vlan10, bridge: br10, subnet: "10.10.0.0/20" }
  - { name: vlan20-bridge, namespace: kube-public, network: vlan20, bridge: br20, subnet: "10.10.16.0/20" }

# ===== Cilium BGP（必須）=====
# 全体で AS 64646 を使う（iBGP）。ピアは FortiGate の 192.168.99.129。
cilium_bgp_enabled: true
cilium_bgp_local_asn: 64646
cilium_bgp_peers:
  - name: fortigate
    address: "192.168.99.129"
    asn: 64646

# ===== Cilium Cluster Mesh =====
# このクラスタ (main) と、ongeki だけのクラスタ (nas。inventory/nas.yml) をつなぐ。
# 名前と ID はクラスタごとに変える (nas は inventory/group_vars/nas_cluster.yml で上書きする)。
# 名前か ID を変えたら、全ての Pod を作り直す (セキュリティ ID に ID が入るため)。
cilium_cluster_name: main
cilium_cluster_id: 1
# 両方のクラスタの Pod CIDR (main 10.11.0.0/16、nas 10.13.0.0/16) を含む範囲。この範囲への通信は NAT しない。
# 10.0.0.0/8 にすると、学内の 10.x (ongeki の無線 LAN の 10.226.0.0/17 など) まで NAT しなくなる。
cilium_native_routing_cidr: "10.8.0.0/13"
cilium_clustermesh_enabled: true
# clustermesh-apiserver はノードの IP の NodePort で公開する (LoadBalancer の IP は相手の
# クラスタの FortiGate のポリシーに個別に足す必要があるため)。
cilium_clustermesh_port: 32379
cilium_clustermesh_clusters:          # 両方のクラスタで同じ。自分のクラスタは Cilium が無視する
  - { name: main, ips: ["192.168.99.200", "192.168.99.201", "192.168.99.202"] }
  - { name: nas, ips: ["192.168.98.2"] }
# 両方のクラスタの証明書を同じ CA で作る。CA は vault.yml の vault_cilium_ca_crt と vault_cilium_ca_key。

# ===== swap（コンテナでのテスト時だけ変える。ホストの swap を止めないため）=====
common_disable_swap: true
kubelet_fail_swap_on: true

# ===== カーネル設定（br_netfilter のないカーネルでのテスト時だけ変える）=====
common_kernel_modules: [overlay, br_netfilter]
common_sysctls:
  - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
  - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
  - { name: net.ipv4.ip_forward, value: "1" }
kubeadm_ignore_preflight_errors: []   # テスト時だけ使う

# ===== kubelet のメモリ予約（メモリが少ないため）=====
kubelet_system_reserved_memory: "512Mi"
kubelet_kube_reserved_memory: "512Mi"
kubelet_eviction_memory: "256Mi"

# ===== ArgoCD が管理するアプリ（k8s/manifest/<path>）=====
argocd_repo_url: "https://github.com/TechnoTUT/Infra.git"
argocd_apps:
  - { name: cam1, path: cam1, namespace: cam1 }
  - { name: cam2, path: cam2, namespace: cam2 }
  - { name: dmx, path: dmx, namespace: qlcplus }
  - { name: live, path: live, namespace: live }
  - { name: ndi, path: ndi, namespace: ndi }
  - { name: speedtest, path: speedtest, namespace: speedtest }
  - { name: time, path: time, namespace: time }
  # BLT は VM で動かす（KubeVirt と CDI が必要。kubevirt_enabled: true）。
  # BLT をコンテナ化する別ブランチがマージされたら、この 2 行と kubevirt_enabled を見直す。
  - { name: blt, path: blt, namespace: blt }
  - { name: cdi-config, path: infrastructure/cdi }
  # Samba (ongeki の /nas)。nas のクラスタに配る (cluster は Argo CD に登録したクラスタの名前)。
  - { name: nas, path: nas, namespace: nas, cluster: nas }

argocd_network_policy: true   # コンテナでのテスト時だけ false にする

# ===== クラスタ内のコンテナレジストリ =====
# 自前でビルドしたイメージ (ndi など) を置く。外部には公開せず、固定の ClusterIP で提供する (HTTP)。
# 名前は bind9 (svc.technotut.net) に固定のレコードとして載せる。クラスタ内の Pod は CoreDNS から
# bind9 に問い合わせて引く。ノードは TUT の DNS を参照するので、/etc/hosts に書く (common ロール)。
# ノードの containerd は Cilium の socket LB で ClusterIP に届く。
# イメージの参照は {{ registry_host }}/<名前>:<タグ> (例: registry.svc.technotut.net/technotut/ndi-discovery-server:main)。
registry_enabled: true
registry_image: "docker.io/library/registry:3"
registry_namespace: registry
registry_host: "registry.{{ dns_zone }}"
registry_cluster_ip: "10.96.0.100"   # Service CIDR の先頭 256 個は自動割り当てに使われにくい範囲
registry_port: 80
registry_address: "{{ registry_host }}"   # ポートが 80 なので省く
registry_storage_size: 20Gi
registry_nfs_path: "{{ nfs_path }}/registry"   # becky の NFS 上の固定の場所。再構築してもイメージが残る

# ===== GitHub Actions の self-hosted runner (ARC) =====
# ジョブが来たときだけ runner の Pod を作る (minRunners: 0)。常駐するのは controller と listener だけ。
# ワークフローでは runs-on: {{ arc_runner_scale_set_name }} と書く。
# GitHub App の情報は Vault に置く (vault_arc_github_app_id など。vault.yml.example を参照)。
arc_enabled: true
arc_github_config_url: https://github.com/TechnoTUT
arc_runner_scale_set_name: k8s
arc_max_runners: 1                    # メモリが少ないため、同時に動かす runner は 1 つ
arc_runner_image: "ghcr.io/actions/actions-runner:latest"   # GitHub が古い runner を拒否するため latest
arc_dind_image: "docker.io/library/docker:dind"
arc_runner_resources:                 # runner (ジョブのステップ) のコンテナ
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 1Gi }
arc_dind_resources:                   # dind (docker build) のコンテナ
  requests: { cpu: "1", memory: 1Gi }
  limits: { memory: 4Gi }

# クラスタ内のレジストリに置くイメージ。site.yml の最後に、レジストリにないものがあれば
# そのリポジトリのワークフローを起動してビルドし直す (/nfs が消えたときなど)。
# GitHub App に Actions: Read and write の権限と、リポジトリへのアクセスが必要。
registry_images:
  - image: technotut/ndi-discovery-server
    tag: main
    repo: TechnoTUT/ndi-discovery-server
    workflow: release-container.yml
    ref: main

# ===== LoadBalancer の IP プール =====
# LoadBalancer の IP は 10.12.0.0/16（BGP で広報する）。用途ごとにプールを分ける。
# - dns:     10.12.0.0。bind9 専用（FortiGate の DNS 転送先）
# - default: IP を指定しない Service に自動で割り当てる
# - static:  loadBalancerIP で IP を固定する Service 用。cilium_lb_static_label を付けた Service だけが使える。
#            自動割り当ての Service に、固定 IP を先に取られないようにするため。
cilium_lb_pool_start: "10.12.0.1"
cilium_lb_pool_stop: "10.12.63.255"
cilium_lb_static_start: "10.12.64.0"
cilium_lb_static_stop: "10.12.255.254"
cilium_lb_static_label: lbipam.technotut.net/static

# ===== DNS (bind9 + ExternalDNS) =====
dns_namespace: bind9
dns_zone: svc.technotut.net
bind9_lb_ip: "10.12.0.0"              # bind9 の LoadBalancer IP。FortiGate の DNS 転送先がこの IP を向いている
bind9_image: "docker.io/internetsystemsconsortium/bind9:9.21"   # 現行と同じ（9.21 系）
bind9_static_records:                  # ゾーンに固定で入れるレコード（他は ExternalDNS が登録する）
  - { name: pa, ip: "192.168.12.22" }
  - { name: registry, ip: "{{ registry_cluster_ip }}" }   # クラスタ内のレジストリ (ClusterIP。クラスタの外からは届かない)
  - { name: drive, ip: "10.14.0.128" }   # NAS の Samba (nas のクラスタの LoadBalancer。k8s/manifest/nas/service.yaml)
externaldns_chart_version: "1.21.1"
externaldns_tsig_keyname: externaldns-key
# TSIG の秘密鍵は vault.yml の vault_externaldns_tsig_secret に置く。

# ===== NAS（nas グループのノード。ongeki）=====
# /nas（md RAID0、ext4）をそのまま Samba のコンテナにマウントする（k8s/manifest/nas/ の local PV）。
# SELinux のラベルを container_file_t にし、ホストの Samba (smb, nmb) は止める。
nas_path: /nas
nas_namespace: nas
# Samba のアカウントは vault.yml の vault_samba_smbpasswd（ホストの `sudo pdbedit -L -w` の出力）から
# Secret (samba-accounts) を作る。

# ===== 機能の有無（nas のクラスタでは使わないものを止める。inventory/group_vars/nas_cluster.yml）=====
nfs_enabled: true            # becky の NFS サーバと NFS provisioner
argocd_enabled: true         # Argo CD (nas のクラスタは main の Argo CD が管理する)
dns_enabled: true            # bind9 と ExternalDNS
cilium_ingress_enabled: true

# ===== RHEL 系のノード（ongeki: AlmaLinux 10）=====
# containerd の CRI で SELinux を使うか。true にすると Pod が container_t で動くが、kubeadm の
# static Pod (etcd、kube-apiserver) が /var/lib/etcd や /etc/kubernetes/pki を読めずに起動しない。
# ホストの SELinux は Enforcing のまま、コンテナにはラベルを付け分けない。
containerd_enable_selinux: false
# 有効にすると Cilium と競合するので止める（Debian のノードもファイアウォールはない）。
redhat_disable_firewalld: true

# ===== nas のクラスタを main の Argo CD に登録する（inventory/group_vars/nas_cluster.yml で true）=====
argocd_register_cluster: false

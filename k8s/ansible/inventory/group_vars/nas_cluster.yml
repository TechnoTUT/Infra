---
# ongeki だけのクラスタ (nas。inventory/nas.yml) の設定。group_vars/all の値を上書きする。
# main のクラスタ (hosts.yml) には nas_cluster グループがないので、ここは読まれない。

# ===== Kubernetes =====
api_endpoint: "192.168.98.2"         # ongeki
pod_cidr: "10.13.0.0/16"             # main (10.15.0.0/16) と重ならないこと (Cluster Mesh の要件)
# 1 台で Pod も動かすので、control plane の taint を付けない。
kubeadm_init_taints: []

# ===== Cilium =====
cilium_cluster_name: nas
cilium_cluster_id: 2
cilium_bgp_peers:
  - name: fortigate-nas
    address: "192.168.98.1"          # FortiGate の port9
    asn: 64646
# LoadBalancer の IP は 10.14.0.0/24 (main の 10.12.0.0/16 と分ける)。
cilium_lb_pool_start: "10.14.0.1"
cilium_lb_pool_stop: "10.14.0.127"
cilium_lb_static_start: "10.14.0.128"
cilium_lb_static_stop: "10.14.0.254"

# ===== Multus と vxlan-cni =====
# VLAN のトランクにはつながっていないので、VLAN には vxlan-cni (VXLAN) だけでつなぐ。
# FortiGate は VNI ごとに VXLAN インターフェースを 1 つしか作れないため、port9 側は別の VNI
# (vxlan<VLAN>-nas = VLAN + 10000。例: vxlan10-nas = 10010) を使い、dmz 側 (vxlan<VLAN>) と同じ software switch に入れている。
multus_enabled: true
node_dns_servers: ["192.168.98.1"]   # FortiGate の port9 (forward-only の DNS サーバ)
vxlan_cni_remote: "192.168.98.1"     # FortiGate の port9
vxlan_cni_vni_offset: 10000

# ===== 使わないもの =====
kubevirt_enabled: false
nfs_enabled: false
registry_enabled: false
arc_enabled: false
dns_enabled: false                   # drive.svc.technotut.net は main の ExternalDNS が載せる (dns_static_records)
cilium_ingress_enabled: false
fortigate_operator_enabled: false    # FortiGate のポリシーは main の fortigate-operator が書く
aichat_enabled: false                # aichat は main のクラスタだけ
# main の Argo CD が管理する (argocd_server の becky にクラスタを登録する)。
argocd_enabled: false
argocd_register_cluster: true

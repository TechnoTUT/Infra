# 管理用のマシンから SSH で実行する。ノードに Ansible を入れない（ノードを最小・同一に保つ）。
# 接続ユーザーは ~/.ssh/config か ansible_user で指定する。
all:
  vars:
    ansible_user: technotut
  children:
    control_plane:
      hosts:
        becky:
          ansible_host: 192.168.99.200
          node_ip: 192.168.99.200
          nic: eno1
    workers:
      hosts:
        packard:
          ansible_host: 192.168.99.201
          node_ip: 192.168.99.201
          nic: enp2s0
        marie:
          ansible_host: 192.168.99.202
          node_ip: 192.168.99.202
          nic: enp2s0
    k8s:
      children:
        control_plane:
        workers:

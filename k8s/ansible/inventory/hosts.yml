# becky で実行する前提。becky 自身は local 接続、ワーカーは SSH で接続する。
all:
  children:
    control_plane:
      hosts:
        becky:
          ansible_connection: local
          node_ip: 192.168.99.200
          nic: eno1
    workers:
      hosts:
        packard:
          node_ip: 192.168.99.201
          nic: enp2s0
        marie:
          node_ip: 192.168.99.202
          nic: enp2s0
    k8s:
      children:
        control_plane:
        workers:

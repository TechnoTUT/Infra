# 管理用のマシンから SSH で実行する。ノードに Ansible を入れない（ノードを最小・同一に保つ）。
# 接続ユーザーは ~/.ssh/config か ansible_user で指定する。
all:
  vars:
    ansible_user: technotut
  children:
    control_plane:
      hosts:
        becky:
          ansible_host: 192.168.99.200
          node_ip: 192.168.99.200
          nic: eno1
    workers:
      hosts:
        packard:
          ansible_host: 192.168.99.201
          node_ip: 192.168.99.201
          nic: enp2s0
        marie:
          ansible_host: 192.168.99.202
          node_ip: 192.168.99.202
          nic: enp2s0
        # NAS。AlmaLinux 10 (他のノードは Debian 13)。FortiGate の port9 (192.168.98.0/30) にあり、
        # 他のノードと L2 が別なので、Pod 宛ての通信は FortiGate が BGP の経路で中継する。
        ongeki:
          ansible_host: 192.168.98.2
          node_ip: 192.168.98.2
          nic: enp2s0
          network_manage_vlans: false        # VLAN 10/20 のトランクにつながっていない
          bgp_peer: fortigate-nas            # cilium_bgp_peers の name
          node_taints:                       # NAS 専用。toleration のある Pod (Samba) だけを置く
            - node.technotut.net/nas=true:NoSchedule
    # NAS のディスク (/nas) を持つノード
    nas:
      hosts:
        ongeki:
    k8s:
      children:
        control_plane:
        workers:

---
# ExternalDNS (FortiGate の webhook)。site.yml からは tasks_from: dns で呼ぶ。
# svc.technotut.net のレコードは FortiGate の DNS データベースに書く。
- name: FortiGate の API キーが Vault にあることを確認する
  ansible.builtin.assert:
    that: vault_externaldns_fortigate_token is defined
    fail_msg: >
      inventory/group_vars/all/vault.yml に vault_externaldns_fortigate_token がない。
      vault.yml.example を参照して ansible-vault edit で足す。

- name: Namespace と FortiGate の API キーの Secret
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ dns_namespace }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: external-dns-fortigate
        namespace: {{ dns_namespace }}
      type: Opaque
      stringData:
        token: "{{ vault_externaldns_fortigate_token }}"
    apply_no_log: true

- name: CoreDNS から svc のゾーンを FortiGate に問い合わせる
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'coredns-configmap.yaml.j2') }}"

- name: ExternalDNS の values を配置する
  ansible.builtin.template:
    src: external-dns-values.yaml.j2
    dest: "{{ addons_dir }}/external-dns-values.yaml"
    mode: "0600"

# DNSEndpoint の CRD はチャートの crds/ から入る。
- name: ExternalDNS
  ansible.builtin.include_tasks: helm.yml
  vars:
    helm_name: "{{ externaldns_release }}"
    helm_chart: external-dns
    helm_repo: https://kubernetes-sigs.github.io/external-dns/
    helm_version: "{{ externaldns_chart_version }}"
    helm_ns: "{{ dns_namespace }}"
    helm_values: external-dns-values.yaml
    helm_wait: "{{ externaldns_helm_wait }}"

- name: 固定のレコード (DNSEndpoint)
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'dns-static-records.yaml.j2') }}"

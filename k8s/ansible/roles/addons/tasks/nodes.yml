---
# ノードのラベルと taint（inventory の bgp_peer と node_taints）。ノード名は inventory の名前と同じ。
- name: BGP の相手をノードのラベルにする
  ansible.builtin.command: >-
    kubectl label node {{ item }}
    bgp.technotut.net/peer={{ hostvars[item].bgp_peer | default(cilium_bgp_peers[0].name) }}
    --overwrite
  loop: "{{ groups['k8s'] }}"
  register: addons_label
  changed_when: "'not labeled' not in addons_label.stdout"
  when: cilium_bgp_enabled

# node_taints は key=value:Effect の形。付いていなければ付ける（inventory から消しても外さない）。
- name: taint を付ける
  ansible.builtin.shell: |
    set -e
    current="$(kubectl get node {{ item.0.inventory_hostname }} \
      -o jsonpath='{range .spec.taints[*]}{.key}={.value}:{.effect}{"\n"}{end}')"
    if grep -qxF '{{ item.1 }}' <<<"$current"; then exit 0; fi
    kubectl taint node {{ item.0.inventory_hostname }} '{{ item.1 }}' && echo CHANGED
  args:
    executable: /bin/bash
  loop: "{{ groups['k8s'] | map('extract', hostvars) | list | subelements('node_taints', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.inventory_hostname }} {{ item.1 }}"
  register: addons_taint
  changed_when: "'CHANGED' in addons_taint.stdout"

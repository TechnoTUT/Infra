---
# aichat (k8s/manifest/aichat) が使う Gemini API キー、問題の報告先の Discord Webhook URL (任意)、FortiGate の読み取り専用 API トークン (任意) の Secret。
# Deployment などは Argo CD の Application `aichat` が入れる。キーは Google AI Studio で発行した有料枠のもの。
- name: Namespace と Gemini API キーの Secret
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ aichat_namespace }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: aichat
        namespace: {{ aichat_namespace }}
      type: Opaque
      stringData:
        gemini-api-key: "{{ vault_gemini_api_key }}"
        discord-webhook-url: "{{ vault_discord_webhook_url | default('') }}"
    apply_no_log: true

# FortiGate の読み取り専用 API ユーザー (infra-readonly) のトークン。vault に vault_fortigate_readonly_token があるときだけ作る。
# 作り方: FortiGate で `execute api-user generate-key infra-readonly`。trusthost は dmz (192.168.99.128/25)。
- name: FortiGate の読み取り専用トークンの Secret
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: fortigate-readonly
        namespace: {{ aichat_namespace }}
      type: Opaque
      stringData:
        token: "{{ vault_fortigate_readonly_token }}"
    apply_no_log: true
  when: vault_fortigate_readonly_token is defined

---
# aichat (k8s/manifest/aichat) が使う Gemini API キーの Secret。
# Deployment などは Argo CD の Application `aichat` が入れる。キーは Google AI Studio で発行した無料枠のもの。
- name: Namespace と Gemini API キーの Secret
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ aichat_namespace }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: aichat
        namespace: {{ aichat_namespace }}
      type: Opaque
      stringData:
        gemini-api-key: "{{ vault_gemini_api_key }}"
    apply_no_log: true

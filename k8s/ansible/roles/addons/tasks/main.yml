---
# control_plane（becky）で実行する。kubeconfig は kubeadm ロールが配置する。
# ノードに Python ライブラリを入れないよう、helm と kubectl のコマンドだけを使う。
- name: Helm を入れる
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    extra_opts: [--strip-components=1, linux-amd64/helm]
    remote_src: true
    creates: /usr/local/bin/helm
  become: true

- name: 作業用ディレクトリ
  ansible.builtin.file:
    path: "{{ addons_dir }}"
    state: directory
    mode: "0700"

- name: values と manifest を配置する
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ addons_dir }}/{{ item }}"
    mode: "0600"
  loop: [cilium-values.yaml, nfs-values.yaml, argocd-values.yaml, arc-controller-values.yaml, arc-runner-values.yaml]

- name: Cluster Mesh の CA が Vault にあることを確認する
  ansible.builtin.assert:
    that: vault_cilium_ca_crt is defined and vault_cilium_ca_key is defined
    fail_msg: >
      Cluster Mesh (cilium_clustermesh_enabled) には vault.yml の vault_cilium_ca_crt と
      vault_cilium_ca_key が必要（両方のクラスタで同じ CA。vault.yml.example を参照）。
  when: cilium_clustermesh_enabled

# ---- Cilium（CNI がないと他が起動しないので最初）----
- name: Cilium
  ansible.builtin.include_tasks: helm.yml
  vars:
    helm_name: cilium
    helm_chart: cilium
    helm_repo: https://helm.cilium.io
    helm_version: "{{ cilium_version }}"
    helm_ns: kube-system
    helm_values: cilium-values.yaml
    # --wait は LoadBalancer の IP を待つが、IP プールは Cilium の CRD ができてから作る。
    # 待ち合わせになって止まるため、ここでは待たずに DaemonSet の起動を別に待つ。
    helm_wait: false

- name: Cilium の起動を待つ
  ansible.builtin.command: kubectl rollout status {{ item }} -n kube-system --timeout=1800s
  loop: [daemonset/cilium, deployment/cilium-operator]
  changed_when: false

- name: ノードが Ready になるのを待つ
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=900s
  changed_when: false

- name: LoadBalancer の IP プール
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'cilium-lb-pool.yaml.j2') }}"

- name: Cilium BGP の設定
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'cilium-bgp.yaml.j2') }}"
  when: cilium_bgp_enabled

# ---- Multus（thin）----
- name: Multus
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset.yml
  register: addons_apply
  changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"
  when: multus_enabled

- name: NetworkAttachmentDefinition（vlan10 / vlan20 のブリッジ）
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'nad.yaml.j2') }}"
  loop: "{{ multus_nads }}"
  when: multus_enabled

# vxlan-cni: Pod の manifest で VLAN を選ぶ NAD (プラグインと DHCP デーモンは vxlan_cni ロール)。
# 許可する VLAN がなければ NAD を置かない (プラグインは allowedVlans が空だと動かない)。
- name: NetworkAttachmentDefinition（vxlan-cni）
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'nad-vxlan.yaml.j2') }}"
  when: multus_enabled and vxlan_cni_enabled and vxlan_cni_allowed_vlans | length > 0

- name: 許可する VLAN がなければ vxlan-cni の NAD を消す
  ansible.builtin.command: >
    kubectl delete network-attachment-definitions.k8s.cni.cncf.io {{ vxlan_cni_nad_name }}
    -n {{ vxlan_cni_nad_namespace }} --ignore-not-found
  register: addons_vxlan_nad_delete
  changed_when: "'deleted' in addons_vxlan_nad_delete.stdout"
  when: multus_enabled and vxlan_cni_enabled and vxlan_cni_allowed_vlans | length == 0

# ---- ストレージ ----
- name: NFS provisioner
  ansible.builtin.include_tasks: helm.yml
  vars:
    helm_name: nfs-subdir-external-provisioner
    helm_chart: nfs-subdir-external-provisioner
    helm_repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    helm_version: "{{ nfs_provisioner_chart_version }}"
    helm_ns: kube-system
    helm_values: nfs-values.yaml
    helm_wait: false
  when: nfs_enabled

# ---- クラスタ内のコンテナレジストリ（NFS の PVC を使う）----
- name: コンテナレジストリ
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'registry.yaml.j2') }}"
  when: registry_enabled

# ---- NAS の Samba のアカウント（Deployment などは ArgoCD の nas が管理する）----
- name: Samba のアカウントの Secret
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'samba-accounts-secret.yaml.j2') }}"
    apply_no_log: true
  when: groups['nas'] | default([]) | length > 0 and vault_samba_smbpasswd is defined

- name: Samba のアカウントがないことを知らせる
  ansible.builtin.debug:
    msg: >
      vault.yml に vault_samba_smbpasswd がないため、Samba の Secret を作らない
      （Samba の Pod は Secret ができるまで起動しない）。
  when: groups['nas'] | default([]) | length > 0 and vault_samba_smbpasswd is not defined

# ---- GitHub Actions の self-hosted runner ----
- name: GitHub Actions の self-hosted runner (ARC)
  ansible.builtin.include_tasks: arc.yml
  when: arc_enabled

# ---- FortiGate の Kubernetes SDN コネクタ（Service などの IP を FortiGate のアドレスにする）----
- name: FortiGate の SDN コネクタ
  ansible.builtin.include_tasks: fortigate-sdn.yml
  when: fortigate_sdn_enabled

# ---- ArgoCD ----
- name: ArgoCD
  when: argocd_enabled
  block:
    - name: ArgoCD を入れる
      ansible.builtin.include_tasks: helm.yml
      vars:
        helm_name: argocd
        # GitHub のリリース配信 (argoproj.github.io の index が指す先) が 504 を返すことがあるため OCI から取る。
        helm_chart: oci://ghcr.io/argoproj/argo-helm/argo-cd
        helm_version: "{{ argocd_chart_version }}"
        helm_ns: argocd
        helm_values: argocd-values.yaml

    # 各アプリの Application は Git (argocd_root_path) にあり、root から Argo CD が作る。
    - name: ArgoCD の親の Application (App of Apps)
      ansible.builtin.include_tasks: apply.yml
      vars:
        apply_content: "{{ lookup('ansible.builtin.template', 'argocd-root-app.yaml.j2') }}"

# nas のクラスタ: main の Argo CD (argocd_server) から管理できるようにする。
- name: main の Argo CD にこのクラスタを登録する
  ansible.builtin.include_tasks: argocd-cluster.yml
  when: argocd_register_cluster

---
# control_plane（becky）で実行する。kubeconfig は kubeadm ロールが配置する。
# ノードに Python ライブラリを入れないよう、helm と kubectl のコマンドだけを使う。
- name: Helm を入れる
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    extra_opts: [--strip-components=1, linux-amd64/helm]
    remote_src: true
    creates: /usr/local/bin/helm
  become: true

- name: 作業用ディレクトリ
  ansible.builtin.file:
    path: "{{ addons_dir }}"
    state: directory
    mode: "0700"

- name: values と manifest を配置する
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ addons_dir }}/{{ item }}"
    mode: "0600"
  loop: [cilium-values.yaml, nfs-values.yaml, argocd-values.yaml]

# ---- Cilium（CNI がないと他が起動しないので最初）----
- name: Cilium
  ansible.builtin.include_tasks: helm.yml
  vars:
    helm_name: cilium
    helm_chart: cilium
    helm_repo: https://helm.cilium.io
    helm_version: "{{ cilium_version }}"
    helm_ns: kube-system
    helm_values: cilium-values.yaml
    # --wait は LoadBalancer の IP を待つが、IP プールは Cilium の CRD ができてから作る。
    # 待ち合わせになって止まるため、ここでは待たずに DaemonSet の起動を別に待つ。
    helm_wait: false

- name: Cilium の起動を待つ
  ansible.builtin.command: kubectl rollout status {{ item }} -n kube-system --timeout=1800s
  loop: [daemonset/cilium, deployment/cilium-operator]
  changed_when: false

- name: ノードが Ready になるのを待つ
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=900s
  changed_when: false

- name: LoadBalancer の IP プール
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'cilium-lb-pool.yaml.j2') }}"

- name: Cilium BGP の設定
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'cilium-bgp.yaml.j2') }}"
  when: cilium_bgp_enabled

# ---- Multus（thin）----
- name: Multus
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset.yml
  register: addons_apply
  changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"
  when: multus_enabled

- name: NetworkAttachmentDefinition（vlan10 / vlan20 のブリッジ）
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'nad.yaml.j2') }}"
  loop: "{{ multus_nads }}"
  when: multus_enabled

# ---- ストレージ ----
- name: NFS provisioner
  ansible.builtin.include_tasks: helm.yml
  vars:
    helm_name: nfs-subdir-external-provisioner
    helm_chart: nfs-subdir-external-provisioner
    helm_repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    helm_version: "{{ nfs_provisioner_chart_version }}"
    helm_ns: kube-system
    helm_values: nfs-values.yaml
    helm_wait: false

# ---- KubeVirt と CDI（BLT の VM 用）----
# CDI の CR は ArgoCD の cdi-config が管理するので、ここでは operator だけを入れる。
- name: KubeVirt と CDI
  when: kubevirt_enabled
  block:
    - name: KubeVirt operator
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/kubevirt-operator.yaml
      register: addons_apply
      changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

    - name: KubeVirt の CR
      ansible.builtin.include_tasks: apply.yml
      vars:
        apply_content: "{{ lookup('ansible.builtin.template', 'kubevirt-cr.yaml.j2') }}"

    - name: CDI operator
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubevirt/containerized-data-importer/releases/download/{{ cdi_version }}/cdi-operator.yaml
      register: addons_apply
      changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

    - name: virtctl を入れる
      ansible.builtin.get_url:
        url: "https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/virtctl-{{ kubevirt_version }}-linux-amd64"
        dest: /usr/local/bin/virtctl
        mode: "0755"
      become: true

# ---- ArgoCD ----
- name: ArgoCD
  ansible.builtin.include_tasks: helm.yml
  vars:
    helm_name: argocd
    helm_chart: argo-cd
    helm_repo: https://argoproj.github.io/argo-helm
    helm_version: "{{ argocd_chart_version }}"
    helm_ns: argocd
    helm_values: argocd-values.yaml

- name: ArgoCD の Application を作る
  ansible.builtin.include_tasks: apply.yml
  vars:
    apply_content: "{{ lookup('ansible.builtin.template', 'argocd-app.yaml.j2') }}"
  loop: "{{ argocd_apps }}"

# KubeVirt の virt-template-controller は CDI の DataVolume CRD を必要とする。
# CRD は Argo CD の cdi-config が CDI の CR を作った後に現れるので、待つのは Application を作った後にする。
- name: KubeVirt が使えるようになるのを待つ
  when: kubevirt_enabled
  ansible.builtin.command: kubectl wait kubevirt/kubevirt -n kubevirt --for=condition=Available --timeout=3600s
  changed_when: false

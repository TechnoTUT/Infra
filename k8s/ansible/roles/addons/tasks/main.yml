---
# control_plane（becky）で実行する。kubeconfig は kubeadm ロールが配置する。
- name: kubernetes.core の依存ライブラリを入れる
  ansible.builtin.apt:
    name: [python3-kubernetes, python3-yaml]
    state: present
  become: true

- name: Helm を入れる
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    extra_opts: [--strip-components=1, linux-amd64/helm]
    remote_src: true
    creates: /usr/local/bin/helm
  become: true

- name: 作業用ディレクトリ
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.k8s-addons"
    state: directory
    mode: "0700"

- name: values と manifest を配置する
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_facts.env.HOME }}/.k8s-addons/{{ item }}"
    mode: "0600"
  loop: [cilium-values.yaml, nfs-values.yaml, argocd-values.yaml, cilium-bgp.yaml, cilium-lb-pool.yaml, kubevirt-cr.yaml]

# ---- Cilium（CNI がないと他が起動しないので最初）----
- name: Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium
    chart_repo_url: https://helm.cilium.io
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    values_files: ["{{ ansible_facts.env.HOME }}/.k8s-addons/cilium-values.yaml"]
    wait: true

- name: ノードが Ready になるのを待つ
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false

- name: LoadBalancer の IP プール
  ansible.builtin.command: kubectl apply -f {{ ansible_facts.env.HOME }}/.k8s-addons/cilium-lb-pool.yaml
  register: addons_apply
  changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

- name: Cilium BGP の設定
  ansible.builtin.command: kubectl apply -f {{ ansible_facts.env.HOME }}/.k8s-addons/cilium-bgp.yaml
  when: cilium_bgp_enabled
  register: addons_apply
  changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

# ---- Multus（thin）----
- name: Multus
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset.yml
  when: multus_enabled
  register: addons_apply
  changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

- name: NetworkAttachmentDefinition（vlan10 / vlan20 のブリッジ）
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'nad.yaml.j2') | from_yaml }}"
  loop: "{{ multus_nads }}"
  when: multus_enabled

# ---- ストレージ ----
- name: NFS provisioner
  kubernetes.core.helm:
    name: nfs-subdir-external-provisioner
    chart_ref: nfs-subdir-external-provisioner
    chart_repo_url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    chart_version: "{{ nfs_provisioner_chart_version }}"
    release_namespace: kube-system
    values_files: ["{{ ansible_facts.env.HOME }}/.k8s-addons/nfs-values.yaml"]

# ---- KubeVirt と CDI（BLT の VM 用）----
# CDI の CR は ArgoCD の cdi-config が管理するので、ここでは operator だけを入れる。
- name: KubeVirt と CDI
  when: kubevirt_enabled
  block:
    - name: KubeVirt operator
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/kubevirt-operator.yaml
      register: addons_apply
      changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

    - name: KubeVirt の CR
      ansible.builtin.command: kubectl apply -f {{ ansible_facts.env.HOME }}/.k8s-addons/kubevirt-cr.yaml
      register: addons_apply
      changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

    - name: CDI operator
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubevirt/containerized-data-importer/releases/download/{{ cdi_version }}/cdi-operator.yaml
      register: addons_apply
      changed_when: "'created' in addons_apply.stdout or 'configured' in addons_apply.stdout"

    - name: KubeVirt が使えるようになるのを待つ
      ansible.builtin.command: kubectl wait kubevirt/kubevirt -n kubevirt --for=condition=Available --timeout=600s
      changed_when: false

    - name: virtctl を入れる
      ansible.builtin.get_url:
        url: "https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/virtctl-{{ kubevirt_version }}-linux-amd64"
        dest: /usr/local/bin/virtctl
        mode: "0755"
      become: true

# ---- ArgoCD ----
- name: ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    values_files: ["{{ ansible_facts.env.HOME }}/.k8s-addons/argocd-values.yaml"]
    wait: true

- name: ArgoCD の Application を作る
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'argocd-app.yaml.j2') | from_yaml }}"
  loop: "{{ argocd_apps }}"

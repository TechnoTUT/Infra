---
# Docker のリポジトリから containerd.io を入れる（runc を同梱）。
# CNI は Cilium が入れるので CNI plugins は入れない。
- name: containerd.io を入れる（OS ごと）
  ansible.builtin.include_tasks: "{{ ansible_facts.os_family | lower }}.yml"

# パッケージの既定の設定は CRI が無効なので、生成し直す。
- name: config.toml を生成する
  ansible.builtin.shell: |
    set -e
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    touch /etc/containerd/.ansible-generated
  args:
    creates: /etc/containerd/.ansible-generated
  become: true
  notify: restart containerd

# RHEL 系は SELinux が Enforcing。Pod を container_t で動かし、ラベルを付け分ける。
- name: CRI の SELinux を有効にする（RHEL 系）
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)enable_selinux = false$'
    replace: '\1enable_selinux = true'
  become: true
  notify: restart containerd
  when: ansible_facts.os_family == 'RedHat' and containerd_enable_selinux

- name: containerd を有効化して起動する
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
  become: true

# ---- クラスタ内のレジストリ (HTTP) からイメージを取得する ----
- name: レジストリの設定を certs.d から読むようにする
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "(\\[plugins\\.'io\\.containerd\\.cri\\.v1\\.images'\\.registry\\]\\n\\s+config_path = )''"
    replace: "\\1'/etc/containerd/certs.d'"
  become: true
  notify: restart containerd
  when: registry_enabled

- name: クラスタ内のレジストリの hosts.toml
  when: registry_enabled
  become: true
  block:
    - name: certs.d のディレクトリ
      ansible.builtin.file:
        path: "/etc/containerd/certs.d/{{ registry_address }}"
        state: directory
        mode: "0755"

    - name: hosts.toml を置く
      ansible.builtin.copy:
        dest: "/etc/containerd/certs.d/{{ registry_address }}/hosts.toml"
        mode: "0644"
        content: |
          # Ansible (containerd ロール) が管理する。クラスタ内のレジストリは HTTP。
          server = "http://{{ registry_address }}"

          [host."http://{{ registry_address }}"]
            capabilities = ["pull", "resolve"]
      notify: restart containerd

---
- name: TSIG の秘密鍵が Vault にあることを確認する
  ansible.builtin.assert:
    that: vault_externaldns_tsig_secret is defined
    fail_msg: >
      inventory/group_vars/all/vault.yml に vault_externaldns_tsig_secret がない。
      vault.yml.example を参照して ansible-vault create で作る。

- name: Namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ dns_namespace }}"
    state: present

- name: bind9 と TSIG の Secret を適用する
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'bind9.yaml.j2') | from_yaml_all | list }}"
  no_log: true

- name: ExternalDNS の values を配置する
  ansible.builtin.template:
    src: external-dns-values.yaml.j2
    dest: "{{ ansible_facts.env.HOME }}/.k8s-addons/external-dns-values.yaml"
    mode: "0600"

- name: ExternalDNS
  kubernetes.core.helm:
    name: external-dns
    chart_ref: external-dns
    chart_repo_url: https://kubernetes-sigs.github.io/external-dns/
    chart_version: "{{ externaldns_chart_version }}"
    release_namespace: "{{ dns_namespace }}"
    values_files: ["{{ ansible_facts.env.HOME }}/.k8s-addons/external-dns-values.yaml"]

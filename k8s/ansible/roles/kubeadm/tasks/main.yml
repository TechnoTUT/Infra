---
# kubelet / kubeadm / kubectl を入れる（OS ごと）。
# 以前のクラスタで hold されたままだと、指定の系列（{{ k8s_minor }}）に上がらない。
# クラスタに参加する前のノードだけ、指定の系列の最新パッチに揃える。
# 参加済みのノードは勝手に上げない（バージョンを上げるときは kubeadm upgrade を使う）。
- name: ノードがクラスタに参加済みか確認する
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeadm_joined

- name: kubelet kubeadm kubectl を入れる（OS ごと）
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

- name: kubelet を有効化する
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
  become: true

# ===== コントロールプレーン =====
- name: クラスタを初期化する（becky）
  when: inventory_hostname in groups['control_plane']
  block:
    - name: kubeadm の設定を置く
      ansible.builtin.template:
        src: kubeadm-init.yaml.j2
        dest: /etc/kubernetes/kubeadm-init.yaml
        mode: "0600"
      become: true

    - name: kubeadm init
      ansible.builtin.command: >
        kubeadm init --config /etc/kubernetes/kubeadm-init.yaml
        {% if kubeadm_ignore_preflight_errors %}--ignore-preflight-errors={{ kubeadm_ignore_preflight_errors | join(',') }}{% endif %}
      args:
        creates: /etc/kubernetes/admin.conf
      become: true

    - name: ~/.kube を作る
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.kube"
        state: directory
        mode: "0700"

    - name: kubeconfig を配置する
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ ansible_facts.env.HOME }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_facts.user_id }}"
        mode: "0600"
      become: true

# ===== ワーカー =====
- name: join コマンドを取得する（トークンは Git に残さない）
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: true
  register: kubeadm_join_cmd
  changed_when: false
  no_log: true
  when: inventory_hostname in groups['workers']

- name: ワーカーの node-ip を設定する
  ansible.builtin.copy:
    # kubelet の systemd の設定が読むファイル（RHEL 系は /etc/sysconfig）
    dest: "{{ '/etc/sysconfig/kubelet' if ansible_facts.os_family == 'RedHat' else '/etc/default/kubelet' }}"
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
    mode: "0644"
  become: true
  when: inventory_hostname in groups['workers']

- name: kubeadm join
  ansible.builtin.command: >-
    {{ kubeadm_join_cmd.stdout }}
    {% if kubeadm_ignore_preflight_errors %}--ignore-preflight-errors={{ kubeadm_ignore_preflight_errors | join(',') }}{% endif %}
  args:
    creates: /etc/kubernetes/kubelet.conf
  become: true
  no_log: true
  when: inventory_hostname in groups['workers']

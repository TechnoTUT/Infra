---
- name: Kubernetes の apt 鍵
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    executable: /bin/bash
  become: true

- name: Kubernetes の apt リポジトリ
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"
    content: >
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
  become: true

- name: インストール済みの kubeadm のバージョンを確認する
  ansible.builtin.command: dpkg-query -W -f='${Version}' kubeadm
  register: kubeadm_installed
  failed_when: false
  changed_when: false

- name: 指定の系列に揃える必要があるか判定する
  ansible.builtin.set_fact:
    kubeadm_align: >-
      {{ not kubeadm_joined.stat.exists
         and not (kubeadm_installed.stdout.startswith(k8s_minor ~ '.')) }}

- name: hold を外す（揃える場合のみ）
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: [kubelet, kubeadm, kubectl]
  become: true
  when: kubeadm_align | bool

- name: kubelet kubeadm kubectl を入れる
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: "{{ 'latest' if kubeadm_align | bool else 'present' }}"
    update_cache: true
  become: true

- name: hold する（更新は kubeadm upgrade で行う）
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]
  become: true

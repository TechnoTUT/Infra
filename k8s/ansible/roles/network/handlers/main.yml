---
- name: ifup network
  ansible.builtin.command: ifup {{ nic }}.{{ item.id }} {{ item.bridge }}
  loop: "{{ network_vlans }}"
  register: network_ifup
  # DHCP が応答しないと ifup は失敗するが、インターフェース自体は起動する。
  # 結果はこのあとの確認タスクで判定するので、ここでは失敗にしない。
  failed_when: false
  changed_when: "'already configured' not in network_ifup.stderr"
  become: true

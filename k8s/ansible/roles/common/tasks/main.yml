---
- name: 対応している OS か確認する
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: "{{ ansible_facts.distribution }} には対応していない（Debian と RHEL 系だけ）"

# パッケージと、DNS を固定する準備（resolv.conf を DHCP や NetworkManager に書き換えさせない）
- name: OS ごとの準備
  ansible.builtin.include_tasks: "{{ ansible_facts.os_family | lower }}.yml"

- name: ノードの DNS を設定する
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"
    unsafe_writes: true   # バインドマウントされた resolv.conf（コンテナ）でも書けるように
  become: true

# ノードは TUT の DNS を参照するので、クラスタ内のレジストリの名前 (bind9 にある) は引けない。
# containerd がイメージを取得できるよう、/etc/hosts に書く。
- name: クラスタ内のレジストリの名前を /etc/hosts に書く
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ registry_host | regex_escape }}$'
    line: "{{ registry_cluster_ip }} {{ registry_host }}"
    unsafe_writes: true
  become: true
  when: registry_enabled

- name: swap を無効化する
  ansible.builtin.command: swapoff -a
  become: true
  when: common_disable_swap and ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: fstab の swap 行を消す
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'
  become: true
  when: common_disable_swap

- name: カーネルモジュールを読み込む設定
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "{{ common_kernel_modules | join('\n') }}\n"
    mode: "0644"
  become: true

- name: カーネルモジュールをロードする
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"
  become: true

- name: sysctl を設定する
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
    state: present
  loop: "{{ common_sysctls }}"
  become: true

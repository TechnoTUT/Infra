---
- name: 必要なパッケージを入れる
  ansible.builtin.apt:
    name: [ca-certificates, curl, gpg, apt-transport-https, nfs-common]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: swap を無効化する
  ansible.builtin.command: swapoff -a
  become: true
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: fstab の swap 行を消す
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'
  become: true

- name: カーネルモジュールを読み込む設定
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"
  become: true

- name: カーネルモジュールをロードする
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]
  become: true

- name: sysctl を設定する
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
    state: present
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
  become: true

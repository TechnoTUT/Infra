---
# meta パッケージ（task-ssh-server など）を消すと sshd まで autoremove されるため、先に手動扱いにする。
- name: 必要なパッケージを手動インストール扱いにする
  ansible.builtin.shell: |
    for p in {{ common_packages_keep | join(' ') }}; do
      dpkg -s "$p" >/dev/null 2>&1 && apt-mark manual "$p"
    done
    exit 0
  become: true
  register: common_keep
  changed_when: "'set to manually installed' in common_keep.stdout"

- name: 不要なパッケージを削除する（3 台を同じ構成にし、最小に保つ）
  ansible.builtin.apt:
    name: "{{ common_packages_absent }}"
    state: absent
    purge: true
    autoremove: true
  become: true

- name: 必要なパッケージを入れる
  ansible.builtin.apt:
    name: [ca-certificates, curl, gpg, apt-transport-https, nfs-common]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: swap を無効化する
  ansible.builtin.command: swapoff -a
  become: true
  when: common_disable_swap and ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: fstab の swap 行を消す
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'
  become: true
  when: common_disable_swap

- name: カーネルモジュールを読み込む設定
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "{{ common_kernel_modules | join('\n') }}\n"
    mode: "0644"
  become: true

- name: カーネルモジュールをロードする
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"
  become: true

- name: sysctl を設定する
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
    state: present
  loop: "{{ common_sysctls }}"
  become: true

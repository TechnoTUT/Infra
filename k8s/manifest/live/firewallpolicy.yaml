# live: VLAN10 (DJ) と VLAN20 (AV) から、RTMP と HTTP を許可する。
# FortiGate の設定は fortigate-operator が反映する (https://github.com/TechnoTUT/fortigate-operator)。
# 宛先は Service rtmp-service の LB IP だけ。FirewallAddress k8s-live が serviceRef で LB IP に追従する。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallAddress
metadata:
  name: k8s-live
  namespace: live
spec:
  serviceRef:
    name: rtmp-service
  associatedInterface: dmz
  comment: LB IP of Service rtmp-service
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-live-av
  namespace: live
spec:
  srcintf: [sw20]
  dstintf: [dmz]
  srcaddr: [VLAN20 subnet]
  dstaddr: [k8s-live]
  service: [HTTP, RTMP]
  action: accept
  comments: live from VLAN20
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-live-dj
  namespace: live
spec:
  srcintf: [sw10]
  dstintf: [dmz]
  srcaddr: [VLAN10 subnet]
  dstaddr: [k8s-live]
  service: [HTTP, RTMP]
  action: accept
  comments: live from VLAN10

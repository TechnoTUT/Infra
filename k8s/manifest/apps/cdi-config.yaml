# CDI の CR。operator は Ansible (kubevirt_enabled) が入れる。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TechnoTUT/Infra.git
    targetRevision: HEAD
    path: k8s/manifest/infrastructure/cdi
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true

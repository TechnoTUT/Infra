# BLT は VM で動かす (KubeVirt と CDI が必要。Ansible の kubevirt_enabled: true)。
# BLT をコンテナ化する別ブランチがマージされたら、blt.yaml と cdi-config.yaml と kubevirt_enabled を見直す。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TechnoTUT/Infra.git
    targetRevision: HEAD
    path: k8s/manifest/blt
  destination:
    server: https://kubernetes.default.svc
    namespace: blt
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

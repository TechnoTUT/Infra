apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: speedtest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TechnoTUT/Infra.git
    targetRevision: HEAD
    path: k8s/manifest/speedtest
  destination:
    server: https://kubernetes.default.svc
    namespace: speedtest
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# moipctl 本体。Pod のネットワーク (Web・API) に加えて、VXLAN (vxlan-cni) でノードのいる VLAN に直接つなぐ。
#   - VLAN 20 (av):  NDI の送受信 (RX/TX) をするノード
#   - VLAN 42 (ent): 入口のサイネージのノード
# ノードは mDNS (_moip._tcp) で自分を広報するので、同じ VLAN (L2) にいれば IP を知らなくても見つかり、
# 操作の HTTP (TCP 8000) もその VLAN の中だけで済む (FortiGate のポリシーは要らない)。
# ノードを増やす VLAN があれば、annotation に要素を足す (vlan は 10、20、30、40、42〜45 だけ)。
# 表示名を state.json に書くので、1 つだけ動かす。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moipctl
  labels:
    app: moipctl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moipctl
  template:
    metadata:
      labels:
        app: moipctl
      annotations:
        # net1/net2 ではなく、VLAN の名前 (av、ent) にする
        k8s.v1.cni.cncf.io/networks: |
          [
            { "name": "vxlan", "namespace": "kube-public", "interface": "av",  "cni-args": { "vlan": 20 } },
            { "name": "vxlan", "namespace": "kube-public", "interface": "ent", "cni-args": { "vlan": 42 } }
          ]
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: moipctl
        # TechnoTUT/moipctl のタグ (v を除く) を GitHub Actions がビルドして置く (public)。
        # WAN が不安定なので、ノードにあるイメージを使う。更新するときはタグを変える。
        image: ghcr.io/technotut/moipctl:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: moipctl-data
      restartPolicy: Always

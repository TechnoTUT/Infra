apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: blt
  namespace: blt
  labels:
    kubevirt.io/os: linux
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
          - disk:
              bus: virtio
            name: disk0
          - cdrom:
              bus: sata
              readonly: true
            name: cloudinitdisk
          interfaces:
          - name: default
            masquerade: {}
          - name: vlan10
            bridge: {}
          - name: vlan20
            bridge: {}
        machine:
          type: q35
        resources:
          requests:
            memory: 4096M
      networks:
      - name: default
        pod: {}
      - name: vlan10
        multus:
          networkName: kube-public/vlan10-bridge
      - name: vlan20
        multus:
          networkName: kube-public/vlan20-bridge
      volumes:
      - name: disk0
        dataVolume:
          name: blt-dv
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: blt
            ssh_pwauth: true
            disable_root: false
            chpasswd:
              list: |
                root:password
                debian:password
              expire: False
            packages:
              - ifupdown
              - openjdk-21-jre
              - curl
              - ca-certificates
              - xfce4
              - xfce4-goodies
              - lightdm
              - xorg
              - dbus-x11
                    
            write_files:
              - path: /etc/network/interfaces
                content: |
                  auto lo
                  iface lo inet loopback

                  auto enp1s0
                  iface enp1s0 inet dhcp

                  auto enp2s0
                  iface enp2s0 inet dhcp

                  auto enp3s0
                  iface enp3s0 inet dhcp                
              - path: /etc/systemd/system/blt.service
                permissions: "0644"
                content: |

                  [Unit]
                  Description=Beat Link Trigger
                  After=network-online.target
                  Wants=network-online.target

                  [Service]
                  Type=simple
                  User=debian
                  WorkingDirectory=/opt/blt
                  ExecStart=/usr/bin/java -jar /opt/blt/beat-link-trigger.jar
                  Restart=on-failure
                  RestartSec=5

                  [Install]
                  WantedBy=multi-user.target
              - path: /home/debian/.config/autostart/blt.desktop
                owner: debian:debian
                permissions: "0644"
                content: |
                  [Desktop Entry]
                  Type=Application
                  Name=Beat Link Trigger
                  Exec=/usr/bin/java -jar /opt/blt/beat-link-trigger.jar
                  Terminal=false
                  X-GNOME-Autostart-enabled=true   
              - path: /etc/lightdm/lightdm.conf.d/50-autologin.conf     
                  [Seat:*]
                  autologin-user=debian
                  autologin-user-timeout=0      
            runcmd:
              - ifdown -a || true
              - ifup -a
              - mkdir -p /opt/blt
              - curl -fL -o /opt/blt/beat-link-trigger.jar https://github.com/Deep-Symmetry/beat-link-trigger/releases/download/latest-preview/beat-link-trigger-8.1.0-Preview.jar
              - chown -R debian:debian /opt/blt
              - systemctl daemon-reload
              - systemctl enable --now blt.service
              - mkdir -p /home/debian/.config/autostart
              - chown -R debian:debian /home/debian/.config
              - systemctl disable blt.service || true
              - systemctl enable lightdm
              - systemctl set-default graphical.target
        name: cloudinitdisk

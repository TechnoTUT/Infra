apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: blt
  namespace: blt
  labels:
    kubevirt.io/os: linux
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
          - disk:
              bus: virtio
            name: disk0
          - cdrom:
              bus: sata
              readonly: true
            name: cloudinitdisk
          interfaces:
          - name: default
            masquerade: {}
          - name: vlan10
            bridge: {}
          - name: vlan30
            bridge: {}
        machine:
          type: q35
        resources:
          requests:
            memory: 4096M
      networks:
      - name: default
        pod: {}
      - name: vlan10
        multus:
          networkName: kube-public/vlan10-bridge
      - name: vlan30
        multus:
          networkName: kube-public/vlan30-bridge
      volumes:
      - name: disk0
        persistentVolumeClaim:
          claimName: blt-pvc
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: blt
            ssh_pwauth: true
            disable_root: false
            chpasswd:
              list: |
                root:password
                debian:password
              expire: False
            packages:
              - ifupdown
        
            write_files:
              - path: /etc/network/interfaces
                content: |
                  auto lo
                  iface lo inet loopback
                  
                  auto enp1s0
                  iface enp1s0 inet dhcp
                  
                  auto enp2s0
                  iface enp2s0 inet static
                          address 192.168.13.100
                          netmask 255.255.255.0
                  
                  auto enp3s0
                  iface enp3s0 inet dhcp
                          address 10.14.0.100
                          netmask 255.255.0.0
        
          runcmd:
            - ifdown -a || true
            - ifup -a
        name: cloudinitdisk

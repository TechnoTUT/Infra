# nas のクラスタの LoadBalancer (10.14.0.0/24)。ongeki が BGP で FortiGate (port9) に広報する。
# drive.svc.technotut.net は main のクラスタの bind9 に固定で載せている (bind9_static_records)。
# externalTrafficPolicy: Local でクライアントの IP を残す。
apiVersion: v1
kind: Service
metadata:
  name: samba
  namespace: nas
  labels:
    app: samba
    lbipam.technotut.net/static: "true"
spec:
  selector:
    app: samba
  type: LoadBalancer
  loadBalancerIP: 10.14.0.128
  externalTrafficPolicy: Local
  ports:
    - name: smb
      protocol: TCP
      port: 445
      targetPort: smb

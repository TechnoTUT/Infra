apiVersion: v1
kind: Service
metadata:
  labels:
    lbipam.technotut.net/static: "true"
  name: dmxsim
  namespace: dmxsim
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dmxsim.svc.technotut.net
spec:
  selector:
    app: dmxsim
  type: LoadBalancer
  loadBalancerIP: 10.12.241.254
  ports:
  - name: artnet
    protocol: UDP
    port: 6454
    targetPort: artnet
  - name: http
    protocol: TCP
    port: 80
    targetPort: http

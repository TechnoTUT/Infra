apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmxsim
  labels:
    app: dmxsim
  namespace: dmxsim
spec:
  # Art-Net の受信とブラウザへの配信を同じ Pod で行うため、1 つだけ動かす
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dmxsim
  template:
    metadata:
      labels:
        app: dmxsim
    spec:
      containers:
      - name: dmxsim
        image: registry.svc.technotut.net/technotut/dmxsim:main
        imagePullPolicy: Always
        env:
        # 画面に表示する Art-Net の送り先（Pod の IP ではなく LoadBalancer の名前と IP）
        - name: ADVERTISE
          value: dmxsim.svc.technotut.net,10.12.241.254
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: artnet
          containerPort: 6454
          protocol: UDP
        readinessProbe:
          httpGet:
            path: /api/status
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/status
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      restartPolicy: Always

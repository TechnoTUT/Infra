# aichat: Gemini でクラスタの状態とリポジトリを読んで答える Web チャット (ソースは TechnoTUT/infra-assistant)。
# Argo CD の Application `aichat` が、このディレクトリを kustomize でデプロイする。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aichat
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - firewallpolicy.yaml
  - healthcheck.yaml
  - nodecheck.yaml

# plmux 本体。Pod のネットワーク (GUI) に加えて、VXLAN (vxlan-cni) で DJ の VLAN10 につなぎ、PRO DJ LINK を受ける。
# Ableton Link はこの Pod では広報しない (Carabiner は plmux-carabiner の Pod。VLAN20 だけにつないでいる)。
# PRO DJ LINK の UDP (50000-50002) を使い、SQLite に書くので、1 つだけ動かす。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plmux
  labels:
    app: plmux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plmux
  template:
    metadata:
      labels:
        app: plmux
      annotations:
        # net1 ではなく dj という名前にする。beat-link は DJ 機器と同じサブネットのインターフェースを自動で選ぶ
        k8s.v1.cni.cncf.io/networks: |
          [{ "name": "vxlan", "namespace": "kube-public", "interface": "dj", "cni-args": { "vlan": 10 } }]
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: plmux
        # TechnoTUT/plmux のタグ (v を除く) を GitHub Actions がビルドして置く (public)。
        # WAN が不安定なので、ノードにあるイメージを使う。更新するときはタグを変える。
        image: ghcr.io/technotut/plmux:0.2.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: plmux
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: tmp, mountPath: /tmp }        # sqlite-jdbc のネイティブライブラリの展開先
        # subPath にすると ConfigMap の更新が反映されないので、ディレクトリごとマウントする
        - { name: expressions, mountPath: /config, readOnly: true }
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: plmux-data
      - name: tmp
        emptyDir: {}
      - name: expressions
        configMap:
          name: plmux-expressions
          optional: true
      restartPolicy: Always

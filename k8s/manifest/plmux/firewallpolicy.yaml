# plmux の Pod から VLAN 20 の dmxctl への OSC (UDP 9000)。
# Pod の通信はノードの IP (dmz) に SNAT されて FortiGate を通る。
# FortiGate の設定は fortigate-operator が反映する (https://github.com/TechnoTUT/fortigate-operator)。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallService
metadata:
  name: plmux-osc
spec:
  name: OSC-9000
  udpPortrange: ["9000"]
  comment: dmxctl OSC
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-plmux-osc
spec:
  srcintf: [dmz]
  dstintf: [sw20]
  srcaddr: [dmz]
  dstaddr: [VLAN20 subnet]
  service: [OSC-9000]
  action: accept
  comments: plmux OSC to dmxctl (VLAN20)
---
# 宛先は Service plmux の LB IP だけ。FirewallAddress k8s-plmux が serviceRef で LB IP に追従する。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallAddress
metadata:
  name: k8s-plmux
spec:
  serviceRef:
    name: plmux
  associatedInterface: dmz
  comment: LB IP of Service plmux
---
# plmux の画面は、DJ (VLAN10) からの閲覧と、演出側 (VLAN20) の OBS のオーバーレイで使う。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-plmux-dj
spec:
  srcintf: [sw10]
  dstintf: [dmz]
  srcaddr: [VLAN10 subnet]
  dstaddr: [k8s-plmux]
  service: [HTTP]
  action: accept
  comments: plmux from VLAN10
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-plmux-av
spec:
  srcintf: [sw20]
  dstintf: [dmz]
  srcaddr: [VLAN20 subnet]
  dstaddr: [k8s-plmux]
  service: [HTTP]
  action: accept
  comments: plmux from VLAN20

# VLAN 20 (AV) の PC から、dmxctl connect のクライアントで LB IP (dmxctl-remote の 9300) に接続する。
# 宛先は Service dmxctl-remote の LB IP だけ。FirewallAddress k8s-dmxctl が serviceRef で LB IP に追従する。
# FortiGate の設定は fortigate-operator が反映する (https://github.com/TechnoTUT/fortigate-operator)。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallService
metadata:
  name: dmxctl-remote
spec:
  name: DMXCTL-REMOTE-9300
  tcpPortrange: ["9300"]
  comment: dmxctl remote
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallAddress
metadata:
  name: k8s-dmxctl
spec:
  serviceRef:
    name: dmxctl-remote
  associatedInterface: dmz
  comment: LB IP of Service dmxctl-remote
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-dmxctl-remote
spec:
  srcintf: [sw20]
  dstintf: [dmz]
  srcaddr: [VLAN20 subnet]
  dstaddr: [k8s-dmxctl]
  service: [DMXCTL-REMOTE-9300]
  action: accept
  comments: dmxctl remote from VLAN20
---
# 操作パネル (dmx.svc.technotut.net) は Cilium Ingress の共有 LB で受けるので、宛先は k8s-ingress。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-dmxctl-panel
spec:
  srcintf: [sw20]
  dstintf: [dmz]
  srcaddr: [VLAN20 subnet]
  dstaddr: [k8s-ingress]
  service: [HTTP]
  action: accept
  comments: dmxctl panel from VLAN20

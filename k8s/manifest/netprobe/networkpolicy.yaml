# netprobe の API (8080) には aichat の Pod だけがつなげる。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netprobe-from-aichat
  namespace: netprobe
spec:
  podSelector:
    matchLabels:
      app: netprobe
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: aichat
    ports:
    - { port: 8080, protocol: TCP }

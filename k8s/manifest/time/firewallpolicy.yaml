# time: 部内の誰でも使えるので、VLAN10 (DJ) と VLAN20 (AV) から HTTP を許可する。
# FortiGate の設定は fortigate-operator が反映する (https://github.com/TechnoTUT/fortigate-operator)。
# 宛先は Service time-service の LB IP だけ。FirewallAddress k8s-time が serviceRef で LB IP に追従する。
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallAddress
metadata:
  name: k8s-time
  namespace: time
spec:
  serviceRef:
    name: time-service
  associatedInterface: dmz
  comment: LB IP of Service time-service
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-time-dj
  namespace: time
spec:
  srcintf: [sw10]
  dstintf: [dmz]
  srcaddr: [VLAN10 subnet]
  dstaddr: [k8s-time]
  service: [HTTP]
  action: accept
  comments: time from VLAN10
---
apiVersion: fortigate.technotut.net/v1alpha1
kind: FirewallPolicy
metadata:
  name: al-time-av
  namespace: time
spec:
  srcintf: [sw20]
  dstintf: [dmz]
  srcaddr: [VLAN20 subnet]
  dstaddr: [k8s-time]
  service: [HTTP]
  action: accept
  comments: time from VLAN20

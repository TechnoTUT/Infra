<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechnoTUT AI チャット</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --accent: #3a5bd9; --accent-text: #fff; --user: #e8edff; --code: #f0f2f5; --warn: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e8ec; --muted: #98a2b3; --border: #2b313c;
      --accent: #7090ff; --accent-text: #0d1020; --user: #26304d; --code: #0f1217; --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header button { margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--panel);
         border: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); border-color: transparent; margin-left: 15%; white-space: pre-wrap; }
  .msg.error { color: var(--warn); }
  .tool { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; margin: 2px 0; }
  .thinking { color: var(--muted); font-size: 13px; }
  .msg pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
  .msg code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
  .msg :not(pre) > code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .msg h2, .msg h3, .msg h4 { font-size: 15px; margin: 12px 0 4px; }
  .msg p { margin: 6px 0; }
  .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; }
  .msg a { color: var(--accent); }
  .intro h2 { font-size: 18px; margin: 4px 0 8px; }
  .intro p { color: var(--muted); margin: 4px 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 999px;
          padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--accent); }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px; }
  form .wrap { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 200px; padding: 10px; border-radius: 8px;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  button { border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer;
           background: var(--accent); color: var(--accent-text); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>TechnoTUT AI チャット</h1>
  <span class="meta" id="meta">クラスタは読み取りのみ</span>
  <button class="ghost" id="reset" type="button">新しい会話</button>
</header>
<main id="log"><div class="wrap" id="msgs"></div></main>
<form id="form">
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="クラスタやネットワークについて質問 (Enter で送信、Shift+Enter で改行)"></textarea>
    <button id="send" type="submit">送信</button>
  </div>
  <div class="note">AI はクラスタを読むだけで変更はしません。回答は間違えることがあるので、大事な作業の前は管理者に確認してください。入力は Gemini API の無料枠に送られます。パスワードなどは書かないでください。</div>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), input = $("input"), send = $("send");
const EXAMPLES = [
  "クラスタの調子はどう？",
  "動いていない Pod はある？原因も調べて",
  "このクラスタで動いているアプリを一覧にして、それぞれ何をするものか教えて",
  "新しいアプリを追加するにはどうすればいい？",
  "VLAN の構成を教えて",
  "Argo CD って何？このクラスタでの使われ方を初心者向けに説明して",
];
let history = [];
let busy = false;

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  // s はエスケープ済み
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
// 最小限の Markdown (見出し、リスト、コードブロック、太字、リンク)。先にエスケープするので HTML は通らない
function md(src) {
  const out = [];
  const lines = src.replace(/\r/g, "").split("\n");
  let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const fence = line.match(/^\s*```/);
    if (fence) {
      flushPara(); flushList();
      const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
      continue;
    }
    const e = esc(line);
    let m;
    if ((m = e.match(/^(#{1,4})\s+(.*)/))) {
      flushPara(); flushList();
      const lv = Math.min(4, m[1].length + 1);
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`);
    } else if ((m = e.match(/^\s*([-*]|\d+[.)])\s+(.*)/))) {
      flushPara();
      const kind = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== kind) { flushList(); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline(m[2])}</li>`);
    } else if (!e.trim()) {
      flushPara(); flushList();
    } else {
      flushList(); para.push(e);
    }
  }
  flushPara(); flushList();
  return out.join("");
}

function scroll() { $("log").scrollTop = $("log").scrollHeight; }
function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  msgs.appendChild(d);
  scroll();
  return d;
}
function intro() {
  msgs.innerHTML = "";
  const d = add("intro", `<h2>なんでも聞いてください</h2>
    <p>TechnoTUT の Kubernetes クラスタの状態を調べたり、リポジトリのドキュメントやマニフェストを読んで、使い方や構成を説明します。</p>
    <div class="chips"></div>`);
  const chips = d.querySelector(".chips");
  for (const q of EXAMPLES) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = q;
    b.onclick = () => ask(q);
    chips.appendChild(b);
  }
}
function describeTool(ev) {
  const a = Object.entries(ev.args || {}).filter(([, v]) => v !== "" && v !== null)
    .map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join(" ");
  return `> ${ev.name}${a ? " " + a : ""}`;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  const intro = msgs.querySelector(".intro");
  if (intro) intro.remove();
  add("user", esc(text));
  const box = add("bot", '<div class="tools"></div><div class="thinking">調べています…</div>');
  const tools = box.querySelector(".tools"), thinking = box.querySelector(".thinking");
  try {
    const r = await fetch("api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ history, message: text }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
    let next = 0, answer = null, failures = 0;
    for (;;) {
      await sleep(1000);
      let j;
      try {
        const p = await fetch(`api/jobs/${body.id}?after=${next}`);
        j = await p.json();
        if (!p.ok) throw new Error(j.detail || `HTTP ${p.status}`);
        failures = 0;
      } catch (e) {
        if (++failures >= 5) throw e;
        continue;
      }
      next = j.next;
      for (const ev of j.events) {
        if (ev.type === "tool") {
          const t = document.createElement("div");
          t.className = "tool"; t.textContent = describeTool(ev);
          tools.appendChild(t); scroll();
        } else if (ev.type === "answer") {
          answer = ev.text;
          thinking.outerHTML = md(ev.text);
        } else if (ev.type === "error") {
          box.classList.add("error");
          thinking.textContent = ev.text;
        }
      }
      if (j.done) break;
    }
    if (answer !== null) {
      history.push({ role: "user", text }, { role: "model", text: answer });
      history = history.slice(-20);
    }
  } catch (e) {
    box.classList.add("error");
    thinking.textContent = "エラー: " + e.message;
  } finally {
    busy = false; send.disabled = false; scroll(); input.focus();
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = input.value; input.value = ""; resize(); ask(t); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
input.addEventListener("input", resize);
$("reset").onclick = () => { if (!busy) { history = []; intro(); input.focus(); } };
fetch("api/info").then((r) => r.json()).then((i) => {
  $("meta").textContent = `${i.model} / クラスタは読み取りのみ` + (i.ready ? "" : " / API キー未設定");
}).catch(() => {});
intro();
</script>
</body>
</html>
